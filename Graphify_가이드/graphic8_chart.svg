<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" font-family="Noto Sans CJK KR, sans-serif"><rect width="1200" height="560" rx="24" fill="#F5F1E6"/><text x="600.0" y="58" font-size="32" fill="#14342B" font-weight="bold" text-anchor="middle" letter-spacing="0">쿼리당 토큰 절감 배수 — 공식 재현 예시</text><text x="600.0" y="92" font-size="17" fill="#7C8681" font-weight="normal" text-anchor="middle" letter-spacing="0">원본 전체를 매번 넣는 방식 대비 · 세로축 로그 스케일</text><line x1="145.0" y1="430" x2="1055.0" y2="430" stroke="#7C8681" stroke-width="2"/><rect x="185.0" y="150.0" width="190" height="280.0" rx="10" fill="#14342B" opacity="1"/><text x="280.0" y="132.0" font-size="30" fill="#14342B" font-weight="bold" text-anchor="middle" letter-spacing="0">71.5x</text><text x="280.0" y="466" font-size="19" fill="#22322C" font-weight="bold" text-anchor="middle" letter-spacing="0">52파일 혼합 코퍼스</text><rect x="505.0" y="319.4086261234164" width="190" height="110.5913738765836" rx="10" fill="#2E6B52" opacity="1"/><text x="600.0" y="301.4086261234164" font-size="30" fill="#2E6B52" font-weight="bold" text-anchor="middle" letter-spacing="0">5.4x</text><text x="600.0" y="466" font-size="19" fill="#22322C" font-weight="bold" text-anchor="middle" letter-spacing="0">4파일 혼합 코퍼스</text><rect x="825.0" y="416" width="190" height="14" rx="10" fill="#722F37" opacity="1"/><text x="920.0" y="398" font-size="30" fill="#722F37" font-weight="bold" text-anchor="middle" letter-spacing="0">≈1x</text><text x="920.0" y="466" font-size="19" fill="#22322C" font-weight="bold" text-anchor="middle" letter-spacing="0">6파일 소형 코퍼스</text><text x="600.0" y="516" font-size="19" fill="#722F37" font-weight="bold" text-anchor="middle" letter-spacing="0">작은 저장소는 원래 컨텍스트에 들어가 이득이 거의 없다 — 절감 폭은 프로젝트마다 다르다</text><text x="600.0" y="548" font-size="14.5" fill="#7C8681" font-weight="normal" text-anchor="middle" letter-spacing="0">출처: Graphify docs/how-it-works.md (Karpathy 저장소+논문+이미지 / graphify 소스+논문 / httpx 합성 예제