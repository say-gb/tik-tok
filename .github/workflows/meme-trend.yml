name: 밈트렌드 조사 자동 생성

on:
  schedule:
    - cron: '0 0 * * *' # 매일 09:00 KST (UTC 00:00)
  workflow_dispatch: {}

jobs:
  trend-research:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_args: |
            --allowedTools Bash,Read,WebSearch,WebFetch
          prompt: |
            `낭만클럽-세팅/CLAUDE.md`의 말투 규칙과
            `낭만클럽-세팅/.claude/skills/밈트렌드/SKILL.md`의 밈트렌드 스킬을 읽고,
            오늘 기준 최신 밈·유행어·트렌드를 검색해서 조사해줘.

            결과물에는 다음이 포함되어야 해:
            - 오늘 확인한 밈/트렌드 목록과 출처
            - 낭만클럽 콘텐츠(스레드/칼럼)에 써먹을 수 있는 활용 아이디어

            검증 안 된 정보는 [미검증]으로 표시해.

            작성이 끝나면 다음 명령으로 GitHub 이슈를 생성해:
            gh issue create --title "[밈트렌드] $(date +%Y-%m-%d)" --body "<작성한 결과물 전체>" --label "밈트렌드"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
