name: 하루치 스레드 세트

on:
  schedule:
    - cron: '0 20 * * *' # 매일 05:00 KST (UTC 20:00) — 아침 게시 전에 받아보도록
  workflow_dispatch: {}

jobs:
  daily-set:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: |
            --allowedTools Bash,Read,WebSearch,WebFetch
          prompt: |
            아래 세 파일을 먼저 읽어라.
            - `낭만클럽-세팅/CLAUDE.md` (말투·정체성 규칙)
            - `낭만클럽-세팅/.claude/skills/스레드/SKILL.md` (스레드 글쓰기 규칙)
            - `낭만클럽-세팅/분석/스레드_2026-08-14.md` (계정 분석)

            그리고 오늘 날짜·요일·절기·기념일을 반드시 **검색해서 확인**한다. 지어내지 않는다.

            오늘 하루치 스레드 콘텐츠 세트를 만든다. 아래 5개를 전부 포함한다.

            ## 1. 아침 훅글 (조회 담당)
            짧게. 첫 줄이 스크롤을 멈추게 할 것.
            자폭형 / 숫자형 / 반전형 중 하나. 글자 수 제한은 두지 않는다.
            정보성 도입("오늘은 말복인데")으로 시작하지 않는다.
            + 사진 지시 한 줄.

            ## 2. 저녁 롱폼 (관계·브랜드 담당)
            미식 또는 새벽시장 소재. 지비 톤 그대로.
            **다 읽고 나면 "이 사람 누구지" 싶어서 프로필을 누르게** 쓴다.
            Meta 랭킹 예측 10개 중 3개가 프로필 클릭 계열이다. 팔로우를 요청하지는 않는다.
            + 사진 지시 한 줄.

            ## 3. 답글 나갈 주제 5개
            성장 레버 1위다. Mosseri 본인이 "게시물보다 답글을 훨씬 많이 달라"고 했다.
            품앗이 서클이 아니라 **낭만미식가와 결이 맞는 비인접 계정**(음식·자영업·시장·미식)에
            달 만한 주제와 각도를 5개 제시한다.
            각각 한 줄 요약 + 실제로 달 답글 문장 초안.

            ## 4. 영상 소재 1개
            Buffer 200만 게시물 기준 영상 참여율 5.55%로 이미지(4.55%)·텍스트(2.79%)보다 높다.
            교수님이 **직접 10초 안에 찍을 수 있는 것**으로 제시한다. 편집 필요 없는 것.

            **반드시 오리지널이어야 한다.** 퍼온 영상·남의 콘텐츠는 절대 제안하지 않는다.
            Threads 공식 계정이 "비오리지널 콘텐츠는 도달을 제한한다"고 직접 밝혔다
            (@threads, 2024-10-21).
            출처 표기·워터마크·속도 변경은 오리지널로 인정되지 않는다. 내가 더한 것을 빼면
            원본과 거의 같으면 비오리지널이다.

            ## 5. 토픽 태그
            게시물당 1개. Meta 내부 데이터로 "태그된 글이 조회수 더 높다"가 확인됐다.
            1번과 2번 각각에 붙일 태그를 추천한다.

            ---

            규칙:
            - 복붙해서 바로 올릴 수 있게 완성한다. "이런 식으로 쓰시면 됩니다" 금지.
            - 검증 못 한 정보는 [미검증] 또는 [추정]으로 표시한다.
            - 스레드에서 장보기·가격·공동구매는 밀지 않는다. 스레드는 팬 만들기, 인스타는 장사.

            작성이 끝나면 다음 명령으로 GitHub 이슈를 생성한다:
            gh issue create --title "[하루치] $(date +%Y-%m-%d)" --body "<작성한 결과물 전체>" --label "스레드"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
